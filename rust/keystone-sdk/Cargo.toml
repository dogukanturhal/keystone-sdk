# SPDX-License-Identifier: Apache-2.0
[package]
name = "keystone-sdk"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Wire-compatible core of the Keystone SDK (Apply + primitives) — Rust port."
repository = "https://github.com/dogukanturhal/keystone-sdk"
readme = "README.md"

[lib]
name = "keystone_sdk"

[features]
# Integration tests that require a live PostgreSQL are gated behind this
# feature so the default `cargo test` needs no database.
integration = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# TLS. `ring` rather than the default `aws-lc-rs` so the crate builds with no
# C toolchain, and `default-features = false` so nothing pulls a second
# provider in behind it — rustls 0.23 resolves the provider from process-global
# state, and two of them linked at once is a runtime panic, not a link error.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
