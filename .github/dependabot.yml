version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
