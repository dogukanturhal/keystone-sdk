# This repository is generated from an upstream source; dependency bumps are applied
# upstream and arrive via sync. Grouped monthly PRs here are signals, not merge targets.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2
