name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems use the private report link in SECURITY.md instead of this form.
  - type: dropdown
    id: sdk
    attributes:
      label: Which SDK?
      options: [Go, Rust, .NET, More than one]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Module / crate / package version, or the commit you built from
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Toolchain and PostgreSQL versions
      placeholder: "Go 1.26, PostgreSQL 17"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code and the SQL files involved. Remove credentials.
      render: text
    validations:
      required: true
